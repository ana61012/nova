<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nova.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">nova</a>
  <div class="pill hidden" id="who"><span id="email"></span><button id="logout">Log out</button></div>
</header>

<main>
  <!-- collection slider: shown signed out and signed in -->
  <section class="stage" id="stage" aria-roledescription="carousel" aria-label="The collection">
    <div id="stageTrack"></div>
    <button class="bag hidden" id="bag" type="button" aria-label="Go to your cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span id="bagN">0</span>
    </button>
    <div class="tab" id="stageTab" aria-live="polite"></div>
    <div class="arrows">
      <button type="button" id="prev" aria-label="Previous piece"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" id="next" aria-label="Next piece"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <!-- signed out: welcome + sign in -->
  <section id="welcome" class="welcome hidden">
    <div>
      <h1 class="rise">Dresses with a little moonlight in them.</h1>
      <p class="lede rise">Small runs. A fair queue. Never oversold.</p>
      <form class="auth rise" id="auth">
        <h2>Join the drop</h2>
        <div class="row" id="authTabs">
          <button type="button" data-mode="signup" style="flex:1">Create account</button>
          <button type="button" data-mode="login" style="flex:1">Log in</button>
        </div>
        <!-- step 1: email + password (or just email, for the emailed-code option) -->
        <div id="stepEmail">
          <input id="authEmail" type="email" placeholder="Email" autocomplete="email" style="width:100%">
          <input id="authPassword" type="password" placeholder="Password (at least 8 characters)" autocomplete="new-password" style="width:100%;margin-top:10px">
          <div class="sub" id="authHint" style="margin:8px 0 14px"></div>
          <button class="buy" type="submit" style="width:100%" id="sendBtn">Create account</button>
          <div style="margin-top:12px;text-align:center"><button class="link" type="button" id="modeSwitch"></button></div>
        </div>
        <!-- step 2: code -->
        <div id="stepCode" class="hidden">
          <div class="sub" style="margin-bottom:10px">Enter the code we sent to <b id="sentTo"></b>.</div>
          <input id="authCode" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456"
                 autocomplete="one-time-code" style="letter-spacing:6px;text-align:center;font-size:20px">
          <button class="buy" type="submit" style="width:100%;margin-top:12px" id="verifyBtn">Verify and continue</button>
          <div class="row" style="margin-top:10px">
            <button class="ghost" type="button" id="resendBtn" style="flex:1" disabled>Resend code</button>
            <button class="ghost" type="button" id="changeEmail" style="flex:1">Change email</button>
          </div>
        </div>
        <div class="err" id="authErr"></div>
      </form>
    </div>
  </section>

  <!-- shop -->
  <div id="shop" class="hidden">
    <section class="queue" id="queue"></section>

    <section id="hold" class="panel live hidden">
      <div class="row">
        <div>
          <div class="name">Reserved for you</div>
          <div class="sub" id="holdStatus"></div>
        </div>
        <div class="timer" id="timer">--:--</div>
      </div>
      <div class="lines" id="holdLines"></div>
      <div class="total"><span>Total</span><span id="holdTotal"></span></div>
      <div class="actions" id="holdActions" style="margin-top:14px"></div>
    </section>

    <section id="done" class="panel live hidden"></section>
    <section id="cart" class="panel hidden"></section>

    <div class="intro">
      <h2 id="dropName">nova</h2>
      <div class="sub">Limited stock. Fair queue. Holds expire. No oversells.</div>
    </div>
    <div id="grid" class="grid"></div>
  </div>
</main>

<footer>nova · <a href="/dashboard">live dashboard</a> · <span id="payNote">payments are simulated</span></footer>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const money = (c) => "₹" + (c / 100).toLocaleString("en-IN");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const readJSON = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };

// The session lives in memory only, so reloading the page signs you out. Wipe anything
// an older version of this page left in localStorage (a stale session, cart or hold).
for (const k of ["session", "hold", "order", "cart"]) localStorage.removeItem(k);
let session = null;                          // { token, email }
let products = [];
let limits = { max_qty_per_product: 3, max_cart_lines: 5 };
let queue = { state: "none" };
let queueAt = Date.now();
let cart = {};      // { [productId]: qty }: a wish list. It holds NO stock until you reserve.
let hold = null;    // { id, items: [{product_id, qty}], expires_at }
let order = null;   // { id, amount_cents }
let stream = null, pollTimer = null, gridSig = "";
let payments = { provider: "simulated", key_id: null };   // from /api/payments/config
let rzpOpen = false;                                       // Razorpay modal is on screen

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 3200);
}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (session) headers.Authorization = "Bearer " + session.token;
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401 && session && !path.startsWith("/api/auth")) { logout(); toast("You were signed out. Please sign in again.", true); throw new Error("signed out"); }
  return r;
}

// FastAPI sends a string for our own errors and a list for validation errors.
async function detail(r) {
  try {
    const d = (await r.json()).detail;
    if (typeof d === "string") return d;
    if (r.status === 422) return "Please check your details and try again.";
    return "That request was not valid.";
  }
  catch { return ""; }
}

const CLOTHES = { aqua: "cut", rouge: "cut", sage: "photo", pearl: "photo" };
const BLURB = {
  aqua: "A beaded halter top with star and crystal charms, with a tiered organza skirt that fades from sea glass to deep water.",
  rouge: "Wine lace bell sleeves and a ruffled corset front over a cream floral wrap skirt, finished with a fine chain at the waist.",
  sage: "An embroidered corset with sheer draped sleeves and a layered tulle skirt, scattered with butterflies and pressed flowers.",
  pearl: "A satin corset dress with ribbon straps, scattered pearls and lace trim, over a full skirt with floating tulle.",
};
const STATIC_SLIDES = [
  { name: "Tidepool Set", image_emoji: "aqua" }, { name: "Rosewood Lace Set", image_emoji: "rouge" },
  { name: "Fern & Butterfly Set", image_emoji: "sage" }, { name: "Pearl Corset Dress", image_emoji: "pearl" },
];
const thumb = (p) => CLOTHES[p?.image_emoji] ? `<img class="thumb" src="/static/clothes/${p.image_emoji}.webp" alt="">` : "";
const productOf = (id) => products.find((p) => p.id === Number(id));
const linesTotal = (lines) => lines.reduce((sum, l) => sum + (productOf(l.product_id)?.price_cents || 0) * l.qty, 0);

// ------------------------------------------------------------------ auth
let pendingEmail = null, resendTimer = null;

function authStep(step) {
  $("#stepEmail").classList.toggle("hidden", step !== "email");
  $("#stepCode").classList.toggle("hidden", step !== "code");
  $("#authTabs").classList.toggle("hidden", step === "code");
  $("#authErr").textContent = "";
  if (step === "code") { $("#sentTo").textContent = pendingEmail; $("#authCode").value = ""; $("#authCode").focus(); }
}

function startResendCountdown(seconds) {
  clearInterval(resendTimer);
  const btn = $("#resendBtn");
  let left = seconds;
  const tick = () => {
    btn.disabled = left > 0;
    btn.textContent = left > 0 ? `Resend in ${left}s` : "Resend code";
    left -= 1;
    if (left < -1) clearInterval(resendTimer);
  };
  tick(); resendTimer = setInterval(tick, 1000);
}

async function sendCode() {
  $("#authErr").textContent = "";
  const r = await api("/api/auth/request-code", { method: "POST", body: JSON.stringify({ email: pendingEmail }) });
  if (r.status === 429) {
    const wait = Number(r.headers.get("Retry-After")) || 60;
    // Already have a live code? Let them type it while the resend timer runs.
    authStep("code"); startResendCountdown(wait);
    $("#authErr").textContent = (await detail(r)) || "Please wait a moment.";
    return;
  }
  if (!r.ok) { $("#authErr").textContent = (await detail(r)) || "Could not send a code."; return; }
  const d = await r.json();
  authStep("code"); startResendCountdown(d.resend_after);
}

// authMode: "signup" (email + new password) | "login" (email + password) | "code" (emailed 6-digit code)
let authMode = "signup";
const MODE = {
  signup: { btn: "Create account", hint: "Pick a password. You'll be signed in straight away.", pw: "new-password" },
  login:  { btn: "Log in", hint: "", pw: "current-password" },
  code:   { btn: "Send me a code", hint: "No password needed. We'll email you a 6-digit code.", pw: "" },
};
function setMode(m) {
  authMode = m;
  for (const t of document.querySelectorAll("#authTabs [data-mode]")) {
    const on = t.dataset.mode === m || (m === "code" && t.dataset.mode === "login");
    t.className = on ? "buy" : "ghost";
  }
  $("#authPassword").classList.toggle("hidden", m === "code");
  $("#authPassword").autocomplete = MODE[m].pw || "off";
  $("#authHint").textContent = MODE[m].hint;
  $("#sendBtn").textContent = MODE[m].btn;
  $("#modeSwitch").textContent = m === "code" ? "Use a password instead" : "Email me a sign-in code instead";
  $("#authErr").textContent = "";
}
$("#authTabs").addEventListener("click", (e) => { const t = e.target.closest("[data-mode]"); if (t) setMode(t.dataset.mode); });
$("#modeSwitch").addEventListener("click", () => setMode(authMode === "code" ? "login" : "code"));
setMode("signup");

function signedIn(d) {
  session = { token: d.token, email: d.email };
  clearInterval(resendTimer); pendingEmail = null; authStep("email");
  $("#authPassword").value = "";
  start();
}

document.querySelector("#auth").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!pendingEmail || !$("#stepEmail").classList.contains("hidden")) {
    const email = $("#authEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#authErr").textContent = "Enter a valid email address."; return; }
    if (authMode === "code") { pendingEmail = email; return sendCode(); }

    const password = $("#authPassword").value;
    if (authMode === "signup" && password.length < 8) { $("#authErr").textContent = "Use a password of at least 8 characters."; return; }
    if (!password) { $("#authErr").textContent = "Enter your password."; return; }
    const btn = $("#sendBtn"); btn.disabled = true; $("#authErr").textContent = "";
    try {
      const r = await api("/api/auth/" + authMode, { method: "POST", body: JSON.stringify({ email, password }) });
      if (r.status === 429) { $("#authErr").textContent = "Too many attempts. Wait a moment and try again."; return; }
      if (!r.ok) {
        const msg = await detail(r);
        $("#authErr").textContent = msg || (authMode === "signup" ? "Could not create the account." : "Could not log in.");
        return;
      }
      signedIn(await r.json());
    } catch { $("#authErr").textContent = "Could not reach the server."; }
    finally { btn.disabled = false; }
    return;
  }
  $("#authErr").textContent = "";
  const r = await api("/api/auth/verify-code", {
    method: "POST",
    body: JSON.stringify({ email: pendingEmail, code: $("#authCode").value.trim() }),
  });
  if (!r.ok) { $("#authErr").textContent = (await detail(r)) || "Could not sign in."; return; }
  signedIn(await r.json());
});
$("#resendBtn").addEventListener("click", sendCode);
$("#changeEmail").addEventListener("click", () => { clearInterval(resendTimer); pendingEmail = null; authStep("email"); });

function logout() {
  session = null; hold = null; order = null; cart = {}; queue = { state: "none" };
  for (const k of ["session", "hold", "order", "cart"]) localStorage.removeItem(k);
  if (stream) stream.close();
  clearInterval(pollTimer);
  show();
}
$("#logout").addEventListener("click", logout);

function show() {
  $("#welcome").classList.toggle("hidden", !!session);
  $("#shop").classList.toggle("hidden", !session);
  $("#who").classList.toggle("hidden", !session);
  $("#bag").classList.toggle("hidden", !session);
  if (session) $("#email").textContent = session.email;
  renderStage();
}

// ------------------------------------------------------------------ queue (live over SSE)
function connectStream() {
  if (stream) stream.close();
  // EventSource cannot send headers, so the token rides in the query string.
  stream = new EventSource("/api/queue/stream?token=" + encodeURIComponent(session.token));
  stream.onmessage = (e) => { queue = JSON.parse(e.data); queueAt = Date.now(); renderQueue(); renderCart(); };
}

function renderQueue() {
  const el = $("#queue");
  el.classList.toggle("in", queue.state === "admitted");
  const left = queue.expires_in == null ? null : Math.max(0, queue.expires_in - Math.floor((Date.now() - queueAt) / 1000));
  const mm = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  let html;
  if (queue.state === "waiting") {
    html = `<div><div class="sub">You are in line. Build your cart while you wait.</div><div class="big">#${queue.position}</div>
            <div class="sub">${queue.waiting_total} waiting in total. Leaving or reloading this page signs you out.</div></div>
            <button class="ghost" data-q="leave">Leave line</button>`;
  } else if (queue.state === "admitted") {
    html = `<div><div class="sub">You're in. Reserve your cart</div><div class="big">${mm(left ?? 0)} left to shop</div></div>
            <button class="ghost" data-q="leave">Done shopping</button>`;
  } else if (queue.state === "expired") {
    html = `<div><div class="sub">Your turn ran out</div><div class="big">Missed your window</div></div>
            <button class="buy" data-q="join">Rejoin at the back</button>`;
  } else {
    html = `<div><div class="sub">${queue.state === "done" ? "You're done for this drop" : "The drop is live"}</div>
            <div class="big">${queue.state === "done" ? "Thanks for shopping" : "Join the queue for a turn"}</div></div>
            <button class="buy" data-q="join">${queue.state === "done" ? "Get back in line" : "Join queue"}</button>`;
  }
  el.innerHTML = html;
}

$("#queue").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-q]");
  if (!b) return;
  const r = await api("/api/queue/" + b.dataset.q, { method: "POST" });
  if (r.status === 429) return toast("Slow down a little.", true);
  if (!r.ok) return toast("Could not update the queue.", true);
  queue = await r.json(); queueAt = Date.now(); renderQueue(); renderCart();
});

// ------------------------------------------------------------------ catalog
async function load() {
  try {
    const d = await (await api("/api/drops/current")).json();
    $("#dropName").textContent = d.name;
    products = d.products;
    limits = d.limits;
    clampCart();
    renderStage(); renderGrid(); renderCart(); renderHold();
  } catch { /* transient; the next poll retries */ }
}

const saveCart = () => localStorage.setItem("cart", JSON.stringify(cart));
const maxFor = (p) => Math.max(0, Math.min(limits.max_qty_per_product, p.available));

// Keep the cart honest as stock changes: drop sold-out lines, trim quantities.
function clampCart() {
  if (!products.length) return;  // not loaded yet: never wipe a saved cart on a slow first load
  let dropped = false, changed = false;
  for (const [id, qty] of Object.entries(cart)) {
    const p = productOf(id), max = p ? maxFor(p) : 0;
    if (max === 0) { delete cart[id]; dropped = changed = true; }
    else if (qty > max) { cart[id] = max; changed = true; }
  }
  if (changed) saveCart();
  if (dropped) toast("Some items sold out and were removed from your cart.", true);
}

function renderGrid() {
  const editable = !hold;
  const sig = JSON.stringify([products, cart, editable]);
  if (sig === gridSig) return;   // skip identical frames so clicks are never lost to a re-render
  gridSig = sig;
  $("#grid").innerHTML = products.map((p) => {
    const pct = (p.available / p.total) * 100;
    const out = p.available === 0;
    const qty = cart[p.id] || 0, max = maxFor(p);
    const color = pct < 25 ? "var(--danger)" : pct < 50 ? "var(--warn)" : "var(--ok)";
    const kind = CLOTHES[p.image_emoji];
    const pic = kind ? `<img class="${kind === "cut" ? "cut" : ""}" src="/static/clothes/${esc(p.image_emoji)}.webp" alt="${esc(p.name)}" loading="lazy">` : "";
    return `<div class="card tone-${esc(p.image_emoji)} ${qty ? "in-cart" : ""} ${out ? "sold-out" : ""}">
      <div class="frame">${pic}</div>
      <div class="meta"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price_cents)}</div></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="stock"><span>${out ? "Sold out" : p.available + " left"}</span><span>max ${limits.max_qty_per_product} each</span></div>
      <div class="stepper">
        <button data-step="-1" data-id="${p.id}" ${!editable || qty === 0 ? "disabled" : ""} aria-label="Remove one">−</button>
        <span class="qty">${qty}</span>
        <button data-step="1" data-id="${p.id}" ${!editable || out || qty >= max ? "disabled" : ""} aria-label="Add one">+</button>
      </div>
    </div>`;
  }).join("");
  updateSlideButtons();
}

function stepCart(id, dir) {
  const p = productOf(id);
  if (!p) return;
  const current = cart[id] || 0;
  if (dir > 0 && current === 0 && Object.keys(cart).length >= limits.max_cart_lines) {
    return toast(`Up to ${limits.max_cart_lines} different items per cart.`, true);
  }
  const next = Math.max(0, Math.min(maxFor(p), current + dir));
  if (next === 0) delete cart[id]; else cart[id] = next;
  saveCart(); renderGrid(); renderCart();
}

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-step]");
  if (!b || b.disabled) return;
  stepCart(b.dataset.id, Number(b.dataset.step));
});

// ------------------------------------------------------------------ cart (client-side wish list)
function renderCart() {
  updateBag();
  const el = $("#cart");
  const lines = Object.entries(cart).map(([id, qty]) => ({ product_id: Number(id), qty })).filter((l) => productOf(l.product_id));
  if (hold || lines.length === 0) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  const units = lines.reduce((s, l) => s + l.qty, 0);
  const admitted = queue.state === "admitted";
  const label = admitted ? "Reserve cart" : queue.state === "waiting" ? "Waiting for your turn…" : "Join the queue first";
  el.innerHTML = `
    <div class="row"><div><div class="name">Your cart · ${units} item${units === 1 ? "" : "s"}</div>
      <div class="sub">Nothing is held until you reserve. Stock can still sell out.</div></div>
      <button class="link" data-c="clear">Clear cart</button></div>
    <div class="lines">${lines.map((l) => {
      const p = productOf(l.product_id);
      return `<div class="line"><span class="l">${thumb(p)}<span>${esc(p.name)} × ${l.qty}</span>
        <button class="link" data-c="remove" data-id="${l.product_id}">Remove</button></span>
        <span>${money(p.price_cents * l.qty)}</span></div>`;
    }).join("")}</div>
    <div class="total"><span>Total</span><span>${money(linesTotal(lines))}</span></div>
    <div class="actions" style="margin-top:12px"><button class="buy" data-c="reserve" ${admitted ? "" : "disabled"}>${label}</button></div>`;
}

$("#cart").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-c]");
  if (!b || b.disabled) return;
  if (b.dataset.c === "clear") { cart = {}; saveCart(); renderGrid(); renderCart(); return; }
  if (b.dataset.c === "remove") { delete cart[b.dataset.id]; saveCart(); renderGrid(); renderCart(); return; }

  b.disabled = true;
  const items = Object.entries(cart).map(([id, qty]) => ({ product_id: Number(id), qty }));
  // One key per click: if the network retries this request, the server dedupes it.
  const key = "cart-" + crypto.randomUUID();
  try {
    const r = await api("/api/reservations", {
      method: "POST", headers: { "Idempotency-Key": key }, body: JSON.stringify({ items }),
    });
    if (r.status === 201 || r.status === 200) {
      const res = await r.json();
      cart = {}; saveCart();
      setHold({ id: res.id, items: res.items, expires_at: res.expires_at }, null);
      toast("Cart reserved. Check out before the timer ends.");
    } else if (r.status === 409) toast((await detail(r)) || "Something in your cart sold out.", true);
    else if (r.status === 403) toast("Wait for your turn in the queue.", true);
    else if (r.status === 429) toast("Slow down. Try again in " + (r.headers.get("Retry-After") || 1) + "s.", true);
    else toast((await detail(r)) || "Something went wrong.", true);
  } catch { toast("Network error.", true); }
  gridSig = ""; load();
});

// ------------------------------------------------------------------ hold, checkout, payment
function setHold(h, o) {
  hold = h; order = o;
  if (h) localStorage.setItem("hold", JSON.stringify(h)); else localStorage.removeItem("hold");
  if (o) localStorage.setItem("order", JSON.stringify(o)); else localStorage.removeItem("order");
  gridSig = ""; renderHold(); renderGrid(); renderCart();
  tick();  // show the countdown immediately instead of "--:--" until the next half-second tick
}

const linesHtml = (items) => items.map((l) => {
  const p = productOf(l.product_id);
  return `<div class="line"><span class="l">${thumb(p)}<span>${esc(p ? p.name : "Item")} × ${l.qty}</span></span>
          <span>${p ? money(p.price_cents * l.qty) : ""}</span></div>`;
}).join("");

function renderHold() {
  updateBag();
  const el = $("#hold");
  if (!hold) { el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  $("#holdStatus").textContent = order ? "Order created. Awaiting payment." : "Not checked out yet.";
  $("#holdLines").innerHTML = linesHtml(hold.items);
  $("#holdTotal").textContent = money(order ? order.amount_cents : linesTotal(hold.items));
  const real = payments.provider === "razorpay";
  $("#holdActions").innerHTML = order
    ? (real
        ? `<button class="buy" data-h="rzp">Pay with Razorpay</button>`
        : `<button class="buy" data-h="pay">Pay now</button>
           <button class="danger" data-h="decline">Simulate declined card</button>`) +
      `<button class="ghost" data-h="cancel">Release</button>`
    : `<button class="buy" data-h="checkout">Checkout</button>
       <button class="ghost" data-h="cancel">Release</button>`;
}

$("#holdActions").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-h]");
  if (!b || !hold) return;
  const action = b.dataset.h;
  b.disabled = true;

  if (action === "cancel") {
    await api("/api/reservations/" + hold.id, { method: "DELETE" });
    setHold(null, null); toast("Hold released."); load(); return;
  }
  if (action === "checkout") {
    const r = await api("/api/orders", { method: "POST", body: JSON.stringify({ reservation_id: hold.id }) });
    if (!r.ok) { toast((await detail(r)) || "Could not start checkout.", true); setHold(null, null); return; }
    const o = await r.json();
    setHold(hold, { id: o.id, amount_cents: o.amount_cents });
    return;
  }
  if (action === "rzp") return payWithRazorpay();
  // pay / decline: the dev endpoint plays the payment gateway and sends a signed webhook
  const outcome = action === "pay" ? "success" : "fail";
  const r = await api(`/api/dev/payments/${order.id}/simulate?outcome=${outcome}`, { method: "POST" });
  const d = await r.json();
  if (d.order_status === "paid") {
    showPaid(hold.items, order.amount_cents);
  } else if (outcome === "fail") {
    toast("Card declined. Your hold is kept, try paying again.", true); renderHold();
  } else {
    toast("Payment did not complete (" + (d.order_status || "unknown") + ").", true); setHold(null, null); load();
  }
});

function showPaid(items, amountCents) {
  $("#done").innerHTML = `<div class="row"><div class="sub">Order confirmed. A confirmation email is on its way.</div>
    <button class="ghost" id="dismiss">Dismiss</button></div>
    <div class="lines">${linesHtml(items)}</div>
    <div class="total"><span>Paid</span><span>${money(amountCents)}</span></div>`;
  $("#done").classList.remove("hidden");
  $("#dismiss").onclick = () => $("#done").classList.add("hidden");
  setHold(null, null); load();
}

// ---- Razorpay Checkout
let rzpScript = null;
function loadRazorpay() {
  if (window.Razorpay) return Promise.resolve();
  rzpScript ??= new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = "https://checkout.razorpay.com/v1/checkout.js";
    el.onload = resolve;
    el.onerror = () => { rzpScript = null; reject(new Error("Could not load Razorpay")); };
    document.head.appendChild(el);
  });
  return rzpScript;
}

async function payWithRazorpay() {
  const items = hold.items, myOrder = order;
  try {
    const [r] = await Promise.all([
      api("/api/payments/razorpay/order", { method: "POST", body: JSON.stringify({ order_id: myOrder.id }) }),
      loadRazorpay(),
    ]);
    if (!r.ok) { toast((await detail(r)) || "Could not start the payment.", true); renderHold(); return; }
    const o = await r.json();
    rzpOpen = true;
    const rz = new window.Razorpay({
      key: o.key_id, amount: o.amount, currency: o.currency, name: "nova",
      description: "Your nova order", order_id: o.razorpay_order_id,
      prefill: { email: session.email }, theme: { color: "#3b3340" },
      handler: async (resp) => {
        // Razorpay says the payment went through; the server checks its signature before trusting it.
        try {
          const v = await api("/api/payments/razorpay/verify", { method: "POST", body: JSON.stringify({
            order_id: myOrder.id, razorpay_order_id: resp.razorpay_order_id,
            razorpay_payment_id: resp.razorpay_payment_id, razorpay_signature: resp.razorpay_signature }) });
          const d = await v.json().catch(() => ({}));
          rzpOpen = false;
          if (v.ok && d.order_status === "paid") return showPaid(items, myOrder.amount_cents);
          toast(v.ok ? "Payment received but the item sold out, so it will be refunded." : ((d.detail) || "Could not confirm the payment."), true);
        } catch { rzpOpen = false; toast("Payment taken, but we could not confirm it yet. It will update shortly.", true); }
        setHold(null, null); load();
      },
      modal: { ondismiss: () => { rzpOpen = false; renderHold(); } },
    });
    rz.on("payment.failed", (resp) => toast((resp.error && resp.error.description) || "Payment failed. Try again.", true));
    rz.open();
  } catch { toast("Could not open Razorpay. Check your connection and try again.", true); renderHold(); }
}

function tick() {
  if (queue.state === "admitted" || queue.state === "waiting") renderQueue();
  if (!hold) return;
  const iso = /Z|[+-]\d\d:?\d\d$/.test(hold.expires_at) ? hold.expires_at : hold.expires_at + "Z";
  const left = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 1000));
  if (left === 0 && rzpOpen) return;   // never yank the page out from under an open payment window
  if (left === 0) { setHold(null, null); toast("Your hold expired.", true); load(); return; }
  const t = $("#timer");
  t.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  t.className = "timer" + (left < 30 ? " low" : "");
}

// ------------------------------------------------------------------ collection slider
const stageEl = $("#stageTrack");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let stageSig = "", stageN = 0, pos = 0, target = 0, raf = 0;
const pad2 = (n) => String(n).padStart(2, "0");
const wrapIdx = (i) => ((i % stageN) + stageN) % stageN;

function renderStage() {
  const list = (session && products.length ? products : STATIC_SLIDES).filter((p) => CLOTHES[p.image_emoji]);
  const sig = JSON.stringify([!!session, list.map((p) => [p.id ?? p.image_emoji, p.name, p.price_cents ?? 0])]);
  if (sig === stageSig) return;
  stageSig = sig; stageN = list.length;
  target = stageN ? Math.min(wrapIdx(target), stageN - 1) : 0; pos = target;
  stageEl.innerHTML = list.map((p) => {
    const k = esc(p.image_emoji), kind = CLOTHES[p.image_emoji];
    return `<article class="slide tone-${k}" data-id="${p.id ?? ""}">
      <div class="mark" aria-hidden="true">${esc(p.name)}</div>
      <div class="echo" aria-hidden="true"><img src="/static/clothes/${k}.webp" alt=""></div>
      <div class="pic"><div class="arch"><img class="${kind === "cut" ? "cut" : ""}" src="/static/clothes/${k}.webp" alt="${esc(p.name)}"></div></div>
      <div class="copy">
        <div class="reveal"><h2>${esc(p.name)}</h2></div>
        <div class="reveal"><p>${esc(BLURB[p.image_emoji] || "")}</p></div>
        <div class="reveal"><div class="priceline"><span>${p.price_cents != null ? money(p.price_cents) : "Small run"}</span><span class="js-stock"></span></div></div>
        <div class="reveal"><button class="buy" type="button" data-add>Add to cart</button></div>
      </div>
    </article>`;
  }).join("");
  $("#stage").classList.toggle("single", stageN < 2);
  layoutStage(); updateTab(); updateSlideButtons();
}

function layoutStage() {
  const n = stageN, cur = n ? wrapIdx(target) : 0;
  [...stageEl.children].forEach((s, i) => {
    let d = (((i - pos) % n) + n) % n;
    if (d > n / 2) d -= n;
    s.style.setProperty("--d", d.toFixed(4));
    s.style.visibility = Math.abs(d) >= 1.001 ? "hidden" : "visible";
    s.classList.toggle("on", i === cur);
    s.inert = i !== cur;
  });
}

function updateTab() {
  const el = $("#stageTab");
  if (!stageN) { el.innerHTML = ""; return; }
  const p = stageEl.children[wrapIdx(target)].querySelector("h2").textContent;
  el.innerHTML = `<span>${pad2(wrapIdx(target) + 1)}</span><i></i><span>${pad2(stageN)}</span><b>${esc(p)}</b>`;
}

function goStage(dir) {
  if (stageN < 2) return;
  target += dir;
  updateTab();
  cancelAnimationFrame(raf);
  const from = pos, to = target, t0 = performance.now(), dur = reduceMotion ? 0 : 1000;
  const ease = (k) => (k < .5 ? 8 * k ** 4 : 1 - (-2 * k + 2) ** 4 / 2);   // easeInOutQuart
  const frame = (t) => {
    const k = dur ? Math.min(1, (t - t0) / dur) : 1;
    pos = from + (to - from) * ease(k);
    layoutStage();
    if (k < 1) raf = requestAnimationFrame(frame);
  };
  layoutStage();            // flips the active slide right away so its text can slice in
  raf = requestAnimationFrame(frame);
}

function updateSlideButtons() {
  for (const s of stageEl.children) {
    const btn = s.querySelector("[data-add]"), stock = s.querySelector(".js-stock");
    if (!btn) continue;
    if (!session) { btn.textContent = "Join the drop"; btn.disabled = false; continue; }
    const p = productOf(s.dataset.id);
    if (!p) continue;
    const qty = cart[p.id] || 0, max = maxFor(p), out = p.available === 0;
    btn.disabled = !!hold || out || qty >= max;
    btn.textContent = hold ? "Cart reserved" : out ? "Sold out" : qty >= max ? `${qty} in cart (max)` : qty ? `Add another · ${qty} in cart` : "Add to cart";
    if (stock) stock.textContent = out ? "Sold out" : `${p.available} left`;
  }
}

function updateBag() {
  const lines = hold ? hold.items : Object.entries(cart).map(([id, qty]) => ({ qty }));
  $("#bagN").textContent = lines.reduce((sum, l) => sum + l.qty, 0);
}

stageEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-add]");
  if (!b || b.disabled) return;
  if (!session) { $("#auth").scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => $("#authEmail").focus({ preventScroll: true }), 500); return; }
  stepCart(b.closest(".slide").dataset.id, 1);
});
$("#prev").addEventListener("click", () => goStage(-1));
$("#next").addEventListener("click", () => goStage(1));
$("#bag").addEventListener("click", () => {
  const dest = [$("#hold"), $("#cart"), $("#grid")].find((el) => !el.classList.contains("hidden"));
  dest.scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("keydown", (e) => {
  if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight") goStage(1);
  if (e.key === "ArrowLeft") goStage(-1);
});
let swipeX = null;
$("#stage").addEventListener("pointerdown", (e) => { swipeX = e.target.closest("button") ? null : e.clientX; });
$("#stage").addEventListener("pointerup", (e) => {
  if (swipeX !== null && Math.abs(e.clientX - swipeX) > 50) goStage(e.clientX < swipeX ? 1 : -1);
  swipeX = null;
});

// ------------------------------------------------------------------ boot
function start() {
  show();
  cart = readJSON("cart", {});
  hold = readJSON("hold", null);
  order = readJSON("order", null);
  // Discard a hold saved by an older single-product version of this page.
  if (hold && !Array.isArray(hold.items)) { hold = null; order = null; localStorage.removeItem("hold"); localStorage.removeItem("order"); }
  connectStream(); load(); renderQueue(); renderHold();
  clearInterval(pollTimer);
  pollTimer = setInterval(load, 1500);
}

// Coming back via the browser's back/forward buttons can restore the old page from
// its cache with the session still in memory; treat that like a fresh visit.
window.addEventListener("pageshow", (e) => { if (e.persisted && session) logout(); });

fetch("/api/payments/config").then((r) => r.json()).then((c) => {
  payments = c;
  $("#payNote").textContent = c.provider === "razorpay" ? "payments by Razorpay" : "payments are simulated";
  renderHold();
}).catch(() => {});

setInterval(tick, 500);
if (session) start(); else show();
</script>
</body>
