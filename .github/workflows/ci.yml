name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  oversell-smoke:
    # Boots the real server and fails the build if a simulated drop ever oversells.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server
        env:
          DROP_EMAIL_BACKEND: memory
          DROP_RATE_LIMIT_ENABLED: "false"
          DROP_QUEUE_BATCH_SIZE: "25"
          DROP_QUEUE_INTERVAL_SECONDS: "0.5"
          DROP_QUEUE_MAX_ACTIVE: "50"
          DROP_QUEUE_ADMIT_WINDOW_SECONDS: "30"
        run: |
          nohup uvicorn app.main:app --port 8000 --timeout-keep-alive 30 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - run: python scripts/loadtest.py --base-url http://localhost:8000 --users 100
      - name: Server log on failure
        if: failure()
        run: cat server.log