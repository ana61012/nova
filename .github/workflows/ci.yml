services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: drop
      POSTGRES_DB: drop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop"]
      interval: 3s
      retries: 10

  api:
    build: .
    environment:
      DROP_DATABASE_URL: postgresql+asyncpg://drop:drop@db:5432/drop
      # Set a real secret outside local development:
      # DROP_JWT_SECRET: ...
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]